services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: claimtracker-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - SA_PASSWORD=Password@123!
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  mssql-data: